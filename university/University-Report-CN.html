<html lang="zh-CN">

<title>深圳广州 大学访问观察</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Hiragino Sans", "Yu Gothic", "Source Han Sans SC", sans-serif;
    background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 55%, #3a3050 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 15% 25%, rgba(201,123,90,.18) 0%, transparent 35%),
      radial-gradient(circle at 80% 75%, rgba(201,169,107,.12) 0%, transparent 40%);
    pointer-events: none;
  }
  .gate {
    position: relative;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .lock-icon {
    font-size: 48px;
    color: #c9a96b;
    margin-bottom: 18px;
  }
  .gate h1 {
    font-family: "Songti SC", "YuMincho", "Hiragino Mincho ProN", Georgia, serif;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .gate .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,.6);
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .gate input[type="password"] {
    width: 100%;
    padding: 14px 18px;
    font-size: 15px;
    font-family: inherit;
    color: #fff;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px;
    outline: none;
    margin-bottom: 14px;
    transition: all .2s;
  }
  .gate input[type="password"]:focus {
    border-color: #c97b5a;
    background: rgba(255,255,255,.12);
  }
  .gate button {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: #fff;
    background: linear-gradient(135deg, #c97b5a 0%, #a35d3f 100%);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s;
    text-transform: uppercase;
  }
  .gate button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,123,90,.4); }
  .gate button:disabled { opacity: 0.5; cursor: wait; }
  .error {
    margin-top: 16px;
    padding: 10px 14px;
    background: rgba(220, 80, 80, .15);
    border: 1px solid rgba(220, 80, 80, .35);
    border-radius: 8px;
    color: #ffb8b8;
    font-size: 13px;
    display: none;
  }
  .error.show { display: block; }
  .meta {
    margin-top: 40px;
    font-size: 11px;
    color: rgba(255,255,255,.35);
    letter-spacing: 0.1em;
  }
</style>
</head>

const STORAGE_KEY = 'sztrip_key_' + PAYLOAD.salt.substring(0, 8);

function b64decode(s) {
  const bin = atob(s);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const passKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
    passKey,
    { name: 'AES-GCM', length: 256 },
    true,
    ['decrypt']
  );
}

async function tryDecrypt(key) {
  const iv = b64decode(PAYLOAD.iv);
  const ct = b64decode(PAYLOAD.ciphertext);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plain);
}

function installDecrypted(html) {
  // Replace the entire document. Use document.open/write/close so scripts re-execute.
  document.open();
  document.write(html);
  document.close();
}

async function attemptWithStoredKey() {
  // sessionStorage persists across same-tab navigation but clears on tab close.
  // Use localStorage instead so cross-page navigation (and refresh) work seamlessly.
  const stored = localStorage.getItem(STORAGE_KEY);
  if (!stored) return false;
  try {
    const rawKey = b64decode(stored);
    const key = await crypto.subtle.importKey(
      'raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']
    );
    const html = await tryDecrypt(key);
    installDecrypted(html);
    return true;
  } catch (e) {
    localStorage.removeItem(STORAGE_KEY);
    return false;
  }
}

document.getElementById('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'UNLOCKING…';
  try {
    const salt = b64decode(PAYLOAD.salt);
    const key = await deriveKey(pw, salt);
    const html = await tryDecrypt(key);
    // Save raw key to localStorage so subsequent pages don't need re-derivation.
    const rawKey = await crypto.subtle.exportKey('raw', key);
    const rawB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(rawKey)));
    localStorage.setItem(STORAGE_KEY, rawB64);
    installDecrypted(html);
  } catch (e) {
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'UNLOCK · 解锁';
    document.getElementById('pw').focus();
    document.getElementById('pw').select();
  }
});

// Auto-attempt with stored key on load
attemptWithStoredKey();
</script>
